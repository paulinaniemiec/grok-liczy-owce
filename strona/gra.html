<meta property="og:description" content="Jedenaście pastwisk z tematami z matematyki klas 4–5. Zbierz wszystkie gwiazdki, zanim Beata zaśnie!">

<style>
:root {
  --ink: #2b2340; --ink-soft: #5a5170;
  --sky1: #7cc8f2; --sky2: #d9f1ff;
  --hill: #8fcf6a; --grass: #5da646; --grass-dark: #4a8f38;
  --yellow: #ffd84d; --pink: #ff6fa8; --blue: #3d8bfd; --green: #2fbf71; --orange: #ff9f1c; --red: #ef4f4f;
  --night: #1d2350; --paper: #fffaf0; --wood: #c98a4b; --wood-dark: #8e5a2b;
  --head: "Baloo 2", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif;
}
* { box-sizing: border-box }
html, body { margin: 0 }
body { min-height: 100vh; font: 700 18px/1.45 var(--body); color: var(--ink); -webkit-font-smoothing: antialiased;
  background: linear-gradient(var(--sky1), var(--sky2) 420px, var(--sky2)) }
img { display: block; max-width: 100% }
button { font: inherit; color: inherit }
[hidden] { display: none !important }
:focus-visible { outline: 4px solid var(--pink); outline-offset: 3px }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 800 20px/1 var(--body); text-decoration: none;
  padding: 15px 30px 16px; border-radius: 999px; border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); background: #fff; color: var(--ink);
  cursor: pointer; transition: transform .12s, box-shadow .12s, opacity .2s; user-select: none }
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink) }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink) }
.btn:disabled { opacity: .45; cursor: default }
.btn-main { background: var(--yellow) }
.btn-small { font-size: 16px; padding: 9px 16px 10px; box-shadow: 0 4px 0 var(--ink) }

/* ---------- górny pasek ---------- */
.top { width: min(1040px, 100% - 24px); margin: 0 auto; padding: 14px 0; display: flex; align-items: center; gap: 14px }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 800 21px/1 var(--head); color: var(--ink); margin-right: auto }
.brand img { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--ink) }
.total { display: flex; align-items: center; gap: 6px; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 5px 14px 5px 10px; font: 900 18px/1 var(--body) }
.total svg { width: 24px; height: 24px; fill: var(--yellow); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round }
.mute { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; cursor: pointer; display: grid; place-items: center; padding: 0 }
.mute svg { width: 24px; height: 24px; fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round }

/* ---------- mapa ---------- */
.map { width: min(1040px, 100% - 24px); margin: 0 auto; padding: 18px 0 60px; text-align: center }
.gtitle { margin: 0; font: 800 clamp(52px, 9vw, 104px)/.95 var(--head); display: flex; justify-content: center; gap: 0 .22em; flex-wrap: wrap }
.gtitle span { display: inline-block; -webkit-text-stroke: .11em var(--ink); paint-order: stroke fill; text-shadow: 0 .07em 0 var(--ink) }
.gtitle span:nth-child(1) { color: #fff; rotate: -3deg } .gtitle span:nth-child(2) { color: var(--yellow); rotate: 2deg }
.lead { max-width: 560px; margin: 18px auto 34px; font-size: 19px }
.fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; text-align: left }
.field { position: relative; display: flex; flex-direction: column; background: #fff; border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink);
  overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s; text-align: left; padding: 0 }
.field:hover:not(.soon) { transform: translateY(-4px) rotate(-.6deg); box-shadow: 0 10px 0 var(--ink) }
.field-pic { height: 130px; display: flex; align-items: flex-end; justify-content: center; gap: 4px; border-bottom: 3px solid var(--ink); position: relative;
  background: linear-gradient(var(--sky2), #fff 55%, var(--hill) 55.5%) }
.field-pic img { height: 74px; width: auto; margin-bottom: 8px }
.field-pic img.big { height: 92px }
.field-num { position: absolute; left: 14px; top: 12px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 800 26px/1 var(--head);
  color: #fff; border: 3px solid var(--ink); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; padding-top: 3px; box-shadow: 0 3px 0 var(--ink) }
.field-body { padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1 }
.field h3 { margin: 0; font: 800 26px/1.05 var(--head) }
.field p { margin: 0; font-size: 16px; color: var(--ink-soft) }
.field .from { font: 900 12px/1 var(--body); letter-spacing: 1px; text-transform: uppercase; color: var(--ink-soft) }
.field-foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; justify-content: space-between }
.stars { display: flex; gap: 2px }
.stars svg { width: 28px; height: 28px; fill: #e9e4f2; stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round }
.stars svg.on { fill: var(--yellow) }
.go { font: 900 15px/1 var(--body); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 999px }
.field.soon { cursor: default; filter: saturate(.35) }
.field .go { text-decoration: none }
.field .go::after { content: ""; position: absolute; inset: 0; border-radius: 21px }   /* cała karta uruchamia grę */
.field .film { position: relative; z-index: 1; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font: 900 14px/1 var(--body);
  color: var(--ink); text-decoration: none; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 7px 12px }
.field a.film:hover { background: var(--sky2) }
.field .film.later { border-style: dashed; color: var(--ink-soft) }
.tri { display: inline-block; width: 0; height: 0; border-left: 10px solid var(--pink); border-top: 6px solid transparent; border-bottom: 6px solid transparent }
.kl { display: inline-block; font: 900 12px/1 var(--body); letter-spacing: .8px; text-transform: uppercase; padding: 5px 8px; border-radius: 7px; border: 2px solid var(--ink); background: #fff; vertical-align: middle }
.kl4 { color: var(--blue) } .kl5 { color: #e07d00 } .kl45 { color: var(--ink) }
.field-pic .kl { position: absolute; right: 12px; top: 14px }
.chips { display: flex; justify-content: center; gap: 10px; margin: -14px 0 26px; flex-wrap: wrap }
.chip { font: 900 16px/1 var(--body); padding: 10px 18px; border-radius: 999px; border: 3px solid var(--ink); background: #fff; cursor: pointer }
.chip.on { background: var(--ink); color: #fff }
.back-home { margin: 30px 0 0 } .back-home a { font-weight: 900; color: var(--ink) }
.lvl-name .kl { font-size: 11px; margin-left: 4px; position: relative; top: -3px }
.film-btn { text-decoration: none; gap: 8px }
.field.soon .go { background: #b9b2c9 }

/* ---------- poziom ---------- */
.level { width: min(1040px, 100% - 24px); margin: 0 auto; padding: 4px 0 50px }
.lvl-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap }
.lvl-name { font: 800 26px/1 var(--head); margin-right: auto }
.dots { display: flex; gap: 6px }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--ink); background: #fff }
.dots i.now { background: var(--yellow); transform: scale(1.25) }
.dots i.ok { background: var(--green) } .dots i.meh { background: var(--orange) }

.stage { position: relative; background: linear-gradient(#fff, var(--paper)); border: 3px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink); overflow: hidden }
.top-row { display: flex; align-items: flex-start; gap: 14px; padding: 18px 22px 0 }
.grok-wrap { flex: none; width: 104px; height: 118px; overflow: hidden; margin-bottom: -2px }
.grok-wrap img { width: 104px }
.say { position: relative; background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 10px 16px 12px; font: 800 20px/1.3 var(--body); box-shadow: 0 4px 0 var(--ink) }
.say-grok { margin-top: 12px; flex: 1; min-height: 56px }
.say-grok::before { content: ""; position: absolute; left: -13px; top: 22px; width: 18px; height: 18px; background: #fff; border: solid var(--ink); border-width: 0 0 3px 3px; rotate: 45deg }
.say b, .say .num { background: var(--yellow); padding: 0 6px; border-radius: 6px; white-space: nowrap }
.say small { display: block; margin-top: 4px; font-size: 16px; color: var(--ink-soft); font-weight: 700 }
.play { padding: 18px 22px 8px; min-height: 280px }
.act-row { display: flex; justify-content: center; gap: 12px; padding: 6px 22px 18px }
.bot-row { display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; padding: 0 22px; min-height: 96px;
  background: linear-gradient(transparent 62%, var(--hill) 62%, var(--hill) 82%, var(--grass) 82%) }
.say-beata { margin-bottom: 52px; max-width: 560px; font-size: 18px; transition: opacity .2s, transform .2s }
.say-beata.off { visibility: hidden; transition: none }
.say-beata::after { content: ""; position: absolute; right: -13px; bottom: 16px; width: 18px; height: 18px; background: #fff; border: solid var(--ink); border-width: 3px 3px 0 0; rotate: 45deg }
.say-beata.off { opacity: 0; transform: translateY(6px) }
.say-beata.bad { background: #ffe4ec } .say-beata.bad::after { background: #ffe4ec }
.say-beata.good { background: #dcf7e8 } .say-beata.good::after { background: #dcf7e8 }
.g-beata { width: 104px; margin-bottom: 6px; flex: none }
.g-beata.hop { animation: hop .5s cubic-bezier(.3,1.6,.5,1) }
.g-beata.shake { animation: shake .45s }
@keyframes hop { 40% { transform: translateY(-26px) rotate(4deg) } }
@keyframes shake { 20% { transform: translateX(-7px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(3px) } }
.tip { background: var(--ink); color: #fff; padding: 10px 22px 12px; font-size: 16px; text-align: center }
.tip a { color: var(--yellow) }

/* ---------- gra: oś liczbowa ---------- */
.axis-wrap { max-width: 820px; margin: 0 auto }
.axis { width: 100%; height: auto; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; overflow: visible }
.axis.locked { cursor: default }
.axis .lbl { font: 800 34px var(--body); fill: var(--ink); text-anchor: middle }
.axis .sh { transition: transform .18s cubic-bezier(.3,1.3,.6,1) }
.axis .bob.hop { animation: svghop .55s cubic-bezier(.3,1.6,.5,1) }
@keyframes svghop { 40% { transform: translateY(-34px) } }
.axis .tag text { font: 900 26px var(--body); text-anchor: middle; fill: #fff }
.axis .tick-hit { fill: transparent }
.drag-hint { text-align: center; font-size: 15px; color: var(--ink-soft); margin: 4px 0 0 }
.opts { display: flex; justify-content: center; gap: 14px; margin-top: 18px; flex-wrap: wrap }
.opt { min-width: 110px; font: 800 28px/1 var(--head); padding: 14px 22px 12px }
.opt.no { background: #ffd0d0; text-decoration: line-through }
.opt.yes { background: #b9f0d1 }
.opt.yes:disabled, .opt.no:disabled { opacity: 1 }

/* ---------- gra: zagrody ---------- */
.herd { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 18px }
.sign { position: relative; background: var(--wood); border: 3px solid var(--ink); border-radius: 12px; padding: 4px 22px 6px; color: #fff; font: 800 26px/1.2 var(--head);
  box-shadow: inset 0 -5px 0 var(--wood-dark), 0 4px 0 var(--ink); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill }
.sign b { font-size: 40px; color: var(--yellow) }
.flock { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 6px 8px; max-width: 900px }
.flock img { width: 34px }
.grp { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; padding: 4px 5px; border: 3px solid var(--wood-dark); border-radius: 10px; background: #fff7e6; max-width: 140px }
.grp img { width: 26px }
.rest { display: flex; align-items: flex-end; gap: 3px; padding: 4px 8px; border: 3px dashed var(--red); border-radius: 10px; background: #ffe4ec; position: relative }
.rest img { width: 30px }
.rest span { position: absolute; top: -13px; left: 8px; background: var(--red); color: #fff; font: 900 12px/1 var(--body); padding: 3px 6px; border-radius: 6px; white-space: nowrap }
.flock .grp, .flock .rest { animation: pop .35s backwards }
@keyframes pop { from { transform: scale(.6); opacity: 0 } }
.pens { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; max-width: 900px; margin: 0 auto }
.pen { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 10px 14px; background: #fff; border: 3px solid var(--ink); border-radius: 18px;
  box-shadow: 0 5px 0 var(--ink); cursor: pointer; transition: transform .12s, box-shadow .12s, background .15s; text-align: center }
.pen::before { content: ""; position: absolute; left: 10px; right: 10px; top: 8px; height: 12px; border-top: 4px solid var(--wood); border-bottom: 4px solid var(--wood); opacity: .5 }
.pen:hover:not(:disabled) { transform: translateY(-2px) }
.pen .k { font: 800 34px/1 var(--head); margin-top: 14px }
.pen .w { font-size: 15px; color: var(--ink-soft) }
.pen .box { position: absolute; right: 10px; top: 10px; width: 28px; height: 28px; border-radius: 8px; border: 3px solid var(--ink); background: #fff; display: grid; place-items: center; font: 900 18px/1 var(--body) }
.pen.sel { background: var(--yellow); transform: translateY(-3px) rotate(-1deg) }
.pen.sel .box::after { content: "✓" }
.pen .res { display: none; font-size: 14px; line-height: 1.3; margin-top: 6px; color: var(--ink) }
.pen .res .eq { display: block; font: 800 20px/1.2 var(--head) }
.pen .verdict { display: none; font: 900 13px/1 var(--body); text-transform: uppercase; letter-spacing: .5px; padding: 4px 8px; border-radius: 6px; margin-top: 4px; color: #fff }
.pens.checked .pen { cursor: default; transform: none }
.pens.checked .pen .res, .pens.checked .pen .verdict { display: block }
.pens.checked .pen .box { display: none }
.pens.zoomable .pen { cursor: pointer }
.pen.v-ok { background: #dcf7e8 } .pen.v-ok .verdict { background: var(--green) }
.pen.v-bad { background: #ffe4ec } .pen.v-bad .verdict { background: var(--red) }
.pen.v-miss { background: #fff1d6 } .pen.v-miss .verdict { background: var(--orange) }
.pen.v-skip .verdict { background: #9a92ad }
.pen.show { outline: 4px solid var(--blue); outline-offset: 2px }
.zoom-hint { text-align: center; font-size: 15px; color: var(--ink-soft); margin: 12px 0 0 }
.cheat { max-width: 640px; margin: 0 auto 16px; background: #fff7c7; border: 3px solid var(--ink); border-radius: 16px; padding: 10px 18px; font-size: 16px }
.cheat h4 { margin: 0 0 4px; font: 800 20px/1.2 var(--head) }
.cheat ul { margin: 0; padding-left: 20px }

/* ---------- zegar finału ---------- */
.clock { display: flex; align-items: center; gap: 10px; padding: 14px 22px 0 }
.clock img { width: 46px }
.clock .bar { flex: 1; height: 18px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden }
.clock i { display: block; height: 100%; background: var(--blue); transition: width .25s linear }
.clock.low i { background: var(--orange) }

/* ---------- gra: szacowanie ---------- */
.meadow { position: relative; aspect-ratio: 2.6 / 1; max-width: 860px; margin: 0 auto; border: 3px solid var(--ink); border-radius: 20px; overflow: hidden;
  background: linear-gradient(var(--sky2), #fff 24%, var(--hill) 24.5%, var(--grass)) }
.meadow > img { position: absolute; animation: runin .7s cubic-bezier(.2,.8,.3,1) backwards }
@keyframes runin { from { transform: translateX(-110vw) } }
.fog { position: absolute; inset: 0; display: grid; place-items: center; animation: fogin .45s cubic-bezier(.2,.8,.3,1);
  background: radial-gradient(130% 90% at 50% 105%, var(--grass) 55%, var(--hill) 55.5%, var(--hill) 70%, transparent 70.5%), linear-gradient(var(--sky2), #fff) }
.fog span { font: 800 clamp(22px, 4vw, 34px)/1.1 var(--head); color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; margin-top: 18% }
@keyframes fogin { from { transform: translateY(100%) } }
.tens { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; width: fit-content; max-width: 100%; margin: 0 auto; padding: 10px 14px;
  border: 3px solid var(--ink); border-radius: 20px; background: #fff; animation: pop .3s }
.ten { display: flex; align-items: center; gap: 2px }
.ten img { width: 34px }
.ten b { margin-left: 10px; font: 800 18px/1 var(--head); color: var(--ink-soft); min-width: 2ch }
.opt.word { font-size: 22px; min-width: 0 }
.guess { max-width: 520px; margin: 16px auto 0; text-align: center; font-size: 20px }
.guess p { margin: 0 0 8px }
.guess b { background: var(--yellow); padding: 0 8px; border-radius: 6px }
.guess input { width: 100%; height: 36px; accent-color: var(--pink); cursor: pointer }
.market { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap }
.price { background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); padding: 12px 20px 14px; text-align: center; min-width: 150px; rotate: -1deg }
.price:nth-child(2) { rotate: 1.5deg }
.price b { display: block; font: 800 36px/1.1 var(--head) }
.price span { font-size: 16px; color: var(--ink-soft) }
.calc { display: flex; align-items: flex-end; justify-content: center; gap: 18px; flex-wrap: wrap; padding-top: 10px }
.calc img { width: 92px }
.lcd { background: #c9f0b4; border: 4px solid var(--ink); border-radius: 16px; padding: 16px 24px; font: 800 clamp(26px, 5vw, 44px)/1 "Courier New", monospace; letter-spacing: 1px;
  box-shadow: inset 0 0 0 5px #a6dd90, 0 6px 0 var(--ink); margin-bottom: 18px }

/* ---------- gra: prostokąt ---------- */
.rows-ctl { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px }
.step { width: 58px; height: 58px; padding: 0; font: 800 34px/1 var(--head) }
.rows-n { text-align: center; min-width: 92px }
.rows-n b { display: block; font: 800 42px/1 var(--head) }
.rows-n span { font-size: 15px; color: var(--ink-soft) }
.pasture { display: grid; gap: 4px; justify-content: center; align-content: start; width: fit-content; max-width: 100%; margin: 0 auto; padding: 12px;
  border: 3px dashed var(--wood-dark); border-radius: 16px; background: #f4fbe9; transition: background .2s, border-color .2s }
.pasture img, .pasture .hole { width: 100%; aspect-ratio: 299 / 260 }
.pasture .hole { box-sizing: border-box; border: 3px dashed var(--red); border-radius: 50%; background: #ffe4ec }
.pasture.full { border-style: solid; border-color: var(--green); background: #dcf7e8 }
.rows-info { text-align: center; font-size: 18px; margin: 12px 0 0 }

/* ---------- gra: okrągłe pary ---------- */
.target { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin-bottom: 16px }
.target img { width: 62px }
.pairs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 760px; margin: 0 auto }
.pair { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 124px; padding: 12px 8px; background: #fff;
  border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink); cursor: pointer; transition: transform .15s, opacity .4s, background .15s }
.pair:hover:not(.gone) { transform: translateY(-2px) }
.pair .one { width: 58px }
.flock-mini { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; max-width: 150px }
.flock-mini img { width: 28px }
.pair .pn { font: 800 36px/1 var(--head) }
.pair.sel { background: var(--yellow); transform: translateY(-4px) rotate(-1.5deg) }
.pair.no { background: #ffd0d0; animation: shake .45s }
.pair.gone { opacity: 0; transform: scale(.6) translateY(-24px); pointer-events: none }
.pair-done { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; min-height: 40px }
.pair-done span { background: #dcf7e8; border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 900; animation: pop .3s }

/* ---------- koniec poziomu ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #1d235099; padding: 16px; animation: fade .2s }
@keyframes fade { from { opacity: 0 } }
.card { width: min(480px, 100%); background: #fff; border: 3px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink); padding: 26px 24px 28px; text-align: center; animation: pop .3s }
.card h2 { margin: 6px 0 4px; font: 800 38px/1 var(--head) }
.card p { margin: 6px 0; color: var(--ink-soft) }
.card .stars { justify-content: center; gap: 8px; margin: 14px 0 8px }
.card .stars svg { width: 64px; height: 64px }
.card .stars svg.on { animation: starpop .5s backwards }
.card .stars svg.on:nth-child(2) { animation-delay: .25s } .card .stars svg.on:nth-child(3) { animation-delay: .5s }
@keyframes starpop { from { transform: scale(0) rotate(-90deg) } 70% { transform: scale(1.25) } }
.card .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px }
.card img { width: 130px; margin: 0 auto }
.card a { color: var(--blue) }

@media (max-width: 860px) { .fields { grid-template-columns: 1fr 1fr } }
@media (max-width: 600px) {
  body { font-size: 17px }
  .brand span { display: none }
  .fields { grid-template-columns: 1fr }
  .top-row { padding: 12px 12px 0; gap: 8px }
  .grok-wrap { width: 70px; height: 84px } .grok-wrap img { width: 70px }
  .say { font-size: 17px; padding: 8px 12px 10px }
  .say-beata { font-size: 16px; margin-bottom: 40px }
  .play { padding: 14px 10px 6px; min-height: 220px }
  .bot-row { padding: 0 10px }
  .g-beata { width: 80px }
  .lvl-name { font-size: 22px; width: 100% }
  .pens { grid-template-columns: 1fr 1fr; gap: 10px }
  .pen .k { font-size: 28px }
  .opt { min-width: 90px; font-size: 24px; padding: 12px 16px 10px }
  .sign { font-size: 21px } .sign b { font-size: 32px }
  .ten img { width: 22px } .ten b { font-size: 15px }
  .pairs { grid-template-columns: 1fr 1fr; gap: 10px } .pair { min-height: 104px } .pair .pn { font-size: 30px } .flock-mini img { width: 22px }
  .price { min-width: 0; flex: 1 1 40%; padding: 10px 12px } .price b { font-size: 28px }
  .calc img { width: 64px } .clock { padding: 10px 12px 0 } .opt.word { font-size: 18px; padding: 12px 14px 10px }
  .flock img { width: 24px } .grp img { width: 21px } .rest img { width: 24px }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important }
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="index.html"><img src="img/awatar.jpg" alt=""><span>Grok liczy owce</span></a>
  <div class="total" title="Zebrane gwiazdki"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg><span id="total">0</span></div>
  <button class="mute" id="mute" aria-label="Wycisz dźwięki"></button>
</header>

<main>
  <section class="map" id="map">
    <h1 class="gtitle"><span>Policz</span><span>stado!</span></h1>
    <p class="lead">Grok ma dużo owiec i jeszcze więcej kłopotów z liczeniem. Wybierz pastwisko i pomóż mu! Za każde dostaniesz do trzech gwiazdek.</p>
    <div class="chips" role="group" aria-label="Pokaż pastwiska dla klasy">
      <button class="chip" data-f="all">Wszystkie</button><button class="chip" data-f="4">Klasa 4</button><button class="chip" data-f="5">Klasa 5</button>
    </div>
    <div class="fields" id="fields"></div>
    <p class="back-home"><a href="index.html#odcinki">← Wszystkie odcinki na stronie głównej</a></p>
  </section>

  <section class="level" id="level" hidden>
    <div class="lvl-bar">
      <button class="btn btn-small" id="back">← Mapa</button>
      <div class="lvl-name"><span id="lvlName"></span> <span id="lvlKl"></span></div>
      <a class="btn btn-small film-btn" id="filmBtn" href="#" target="_blank" rel="noopener"></a>
      <button class="btn btn-small" id="cheatBtn" hidden>Ściąga</button>
      <div class="dots" id="dots"></div>
    </div>
    <div class="stage">
      <div class="clock" id="clock" hidden title="Beata zasypia"><img src="img/owca-spi.png" alt=""><div class="bar"><i id="clockBar"></i></div></div>
      <div class="top-row">
        <div class="grok-wrap"><img src="img/grok.png" alt="Grok"></div>
        <div class="say say-grok" id="grokSay" aria-live="polite"></div>
      </div>
      <div class="play" id="play"></div>
      <div class="act-row"><button class="btn btn-main" id="act">Sprawdź</button><button class="btn" id="act2" hidden></button></div>
      <div class="bot-row">
        <div class="say say-beata off" id="beataSay" aria-live="polite"></div>
        <img class="g-beata" id="beataImg" src="img/beata.png" alt="Owca Beata">
      </div>
      <div class="tip" id="tip" hidden></div>
    </div>
  </section>
</main>

<div class="modal" id="end" hidden><div class="card" id="endCard"></div></div>

<script>
"use strict";
/* ============ narzędzia ============ */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]] } return a };
const fmt = n => n.toLocaleString("pl-PL");
const num = n => `<span class="num">${fmt(n)}</span>`;
function owiec(n) { const d = n % 10, dd = n % 100; if (n === 1) return "owca"; if (d >= 2 && d <= 4 && !(dd >= 12 && dd <= 14)) return "owce"; return "owiec" }
function skokow(n) { const d = n % 10, dd = n % 100; if (n === 1) return "skok"; if (d >= 2 && d <= 4 && !(dd >= 12 && dd <= 14)) return "skoki"; return "skoków" }
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
const starsHTML = n => [0, 1, 2].map(i => STAR.replace("<svg", `<svg class="${i < n ? "on" : ""}"`)).join("");

/* ============ zapis w przeglądarce ============ */
const SAVE_KEY = "grok-gra";
let save = { stars: {}, mute: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}) } catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)) } catch (e) {} };

/* ============ dźwięki (Web Audio, bez plików) ============ */
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)() } catch (e) {} } return ac }
function tone(f, start, dur, type = "triangle", vol = .14) {
  const a = audio(); if (!a) return; const t = a.currentTime + start;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function bee() {
  const a = audio(); if (!a) return; const t = a.currentTime;
  const o = a.createOscillator(), l = a.createOscillator(), lg = a.createGain(), f = a.createBiquadFilter(), g = a.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(390, t); o.frequency.linearRampToValueAtTime(300, t + .5);
  l.frequency.value = 13; lg.gain.value = 28; l.connect(lg).connect(o.frequency);
  f.type = "lowpass"; f.frequency.value = 1500;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.11, t + .05); g.gain.setValueAtTime(.11, t + .38); g.gain.linearRampToValueAtTime(0, t + .55);
  o.connect(f).connect(g).connect(a.destination); o.start(t); l.start(t); o.stop(t + .6); l.stop(t + .6);
}
function sfx(kind) {
  if (save.mute) return;
  if (kind === "ok") { tone(660, 0, .15); tone(990, .1, .25) }
  else if (kind === "bad") bee();
  else if (kind === "tick") tone(1300, 0, .04, "sine", .05);
  else if (kind === "click") tone(520, 0, .06, "square", .04);
  else if (kind === "win") [523, 659, 784, 1046].forEach((f, i) => tone(f, i * .13, .3));
}
const SPEAKER_ON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SPEAKER_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>';
function drawMute() { $("#mute").innerHTML = save.mute ? SPEAKER_OFF : SPEAKER_ON; $("#mute").setAttribute("aria-label", save.mute ? "Włącz dźwięki" : "Wycisz dźwięki") }
$("#mute").onclick = () => { save.mute = !save.mute; persist(); drawMute(); sfx("click") };
drawMute();

/* ============ odcinki (linki do filmów) ============ */
// Po wrzuceniu odcinka na YouTube wpisz jego adres w `url`. Do tego czasu link prowadzi na kanał.
const KANAL = "https://www.youtube.com/@grokliczyowce";
const ODCINKI = {
  1: { tytul: "Liczby naturalne", url: "https://www.youtube.com/watch?v=NEiQK3w0GOs", rozdzial: "2:55", co: "Liczby na osi i porównywanie (&lt; &gt;)" },
  4: { tytul: "Dzielenie pisemne", url: "https://www.youtube.com/watch?v=GWMigBTXm8A", rozdzial: "0:26", co: "852 : 3 krok po kroku" },
  6: { tytul: "Dodawanie i odejmowanie", url: "https://www.youtube.com/watch?v=6-Dt63XVpCM", rozdzial: "0:28", co: "Składnik, suma, odjemna, odjemnik, różnica" },
  10: { tytul: "Zadania tekstowe", url: "https://www.youtube.com/watch?v=uovow-ytGzM", rozdzial: "0:27", co: "Trzy kroki: dane, obliczenia, odpowiedź" },
  11: { tytul: "Trójkąty", url: "https://www.youtube.com/watch?v=AVuYOJIyyMI", rozdzial: "0:26", co: "Warunek trójkąta" },
  2: { tytul: "Cechy podzielności", url: "https://www.youtube.com/watch?v=ClVDgk-Ps1E", rozdzial: "4:51", co: "Ściąga: wszystkie cechy podzielności" },
  3: { tytul: "Liczby pierwsze i złożone", url: "https://www.youtube.com/watch?v=axhkUmy1AgY", rozdzial: "0:53", co: "Liczba pierwsza" },
  5: { tytul: "Oś liczbowa", url: "https://www.youtube.com/watch?v=RIXLuf781SQ", rozdzial: "1:50", co: "Różne osie: co 2, co 5, co 100" },
  7: { tytul: "Szacowanie", url: "https://www.youtube.com/watch?v=5HGl8kqOalU", rozdzial: "0:24", co: "Kilka, kilkanaście, kilkadziesiąt, kilkaset" },
  8: { tytul: "Sprytne dodawanie", url: "https://www.youtube.com/watch?v=fP3Fg6p8jWc", rozdzial: "1:43", co: "Szukamy pełnych dziesiątek" },
  9: { tytul: "Wielka powtórka", url: "https://www.youtube.com/watch?v=qswL8UbfW60" },
};
function epHref(nr, chapter = true) {
  const o = ODCINKI[nr];
  if (!o.url) return KANAL;
  let href = o.url;
  if (chapter && o.rozdzial) { const [m, s] = o.rozdzial.split(":").map(Number); href += (href.includes("?") ? "&" : "?") + "t=" + (m * 60 + s) }
  return href;
}
const KLASA = { "4": "Klasa 4", "5": "Klasa 5", "45": "Klasy 4–5" };
const klasaTag = k => `<span class="kl kl${k}">${KLASA[k]}</span>`;
function epLink(nr) {
  const o = ODCINKI[nr], href = epHref(nr);
  const where = o.url && o.rozdzial ? `, rozdział ${o.rozdzial} „${o.co}”` : "";
  return `<a href="${href}" target="_blank" rel="noopener">odcinek ${nr} „${o.tytul}”${where}</a>`;
}

/* ============ pastwiska ============ */
const PASTWISKA = [
  { key: "szacowanie", klasa: "4", nr: 1, color: "var(--orange)", title: "Ile owiec?", ep: 7, desc: "Stado przebiega przez łąkę. Zgadnij, ile było owiec.", pics: ["owca", "owca", "owca"] },
  { key: "os", klasa: "4", nr: 2, color: "var(--blue)", title: "Owca na osi", ep: 5, desc: "Postaw owcę we właściwym miejscu na osi liczbowej.", pics: ["owca", "beata"] },
  { key: "zagrody", klasa: "5", nr: 3, color: "var(--green)", title: "Zagrody", ep: 2, desc: "Do których zagród owce zmieszczą się po równo?", pics: ["grok", "owca", "owca"] },
  { key: "prostokat", klasa: "5", nr: 4, color: "var(--pink)", title: "Stado w prostokąt", ep: 3, desc: "Ustaw owce w równe rzędy. Czy to liczba pierwsza?", pics: ["owca", "owca", "owca"] },
  { key: "pary", klasa: "4", nr: 5, color: "#9b6bff", title: "Okrągłe pary", ep: 8, desc: "Połącz grupki owiec, które razem dają okrągłą liczbę.", pics: ["kosmita", "owca"] },
  { key: "porownaj", klasa: "4", nr: 6, color: "#ff7a59", title: "Która większa?", ep: 1, desc: "Znak &lt; i &gt; otwiera paszczę w stronę większej liczby. Porównuj i licz worki kamyków.", pics: ["owca", "beata"] },
  { key: "snopki", klasa: "5", nr: 7, color: "var(--wood)", title: "Snopki dla zagród", ep: 4, desc: "Dziel pisemnie krok po kroku: dzielę, mnożę, odejmuję, dopisuję.", pics: ["grok", "owca"] },
  { key: "zostalo", klasa: "4", nr: 8, color: "#14b8a6", title: "Ile zostało?", ep: 6, desc: "Składnik, suma, odjemna, odjemnik, różnica. I kto tu jest różnicą?", pics: ["beata", "owca", "owca"] },
  { key: "zadania", klasa: "4", nr: 9, color: "#e2557a", title: "Ile lat ma pasterz?", ep: 10, desc: "Dane, obliczenia, odpowiedź. Uważaj na zadania z haczykiem!", pics: ["kosmita", "grok"] },
  { key: "trojkaty", klasa: "5", nr: 10, color: "#f59e0b", title: "Trójkątna zagroda", ep: 11, desc: "Z których desek zbudujesz zagrodę? Policz trzeci kąt.", pics: ["grok", "owca"] },
  { key: "final", klasa: "45", nr: "★", color: "var(--night)", title: "Wielka powtórka", ep: 9, desc: "Wszystko naraz i na czas. Dasz radę przed snem?", pics: ["beata", "owca-spi"] },
];

function drawMap() {
  const f = save.klasa || "all";
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.f === f));
  $("#fields").innerHTML = PASTWISKA.filter(p => f === "all" || p.klasa.includes(f)).map(p => {
    const st = save.stars[p.key] || 0, o = ODCINKI[p.ep];
    const pics = p.pics.map(n => `<img src="img/${n}.png" alt="" class="${n === "grok" || n === "kosmita" ? "big" : ""}">`).join("");
    const film = o.url
      ? `<a class="film" href="${epHref(p.ep, false)}" target="_blank" rel="noopener"><span class="tri"></span>Obejrzyj odcinek ${p.ep}</a>`
      : `<span class="film later">Odcinek ${p.ep} wkrótce na YouTube</span>`;
    return `<div class="field">
      <div class="field-pic">${pics}<span class="field-num" style="background:${p.color}">${p.nr}</span>${klasaTag(p.klasa)}</div>
      <div class="field-body">
        <span class="from">Z odcinka ${p.ep}: ${o.tytul}</span>
        <h3>${p.title}</h3><p>${p.desc}</p>
        <div class="field-foot"><div class="stars">${starsHTML(st)}</div><a class="go" href="#${p.key}">${st ? "Zagraj jeszcze raz" : "Graj"}</a></div>
        ${film}
      </div></div>`;
  }).join("");
  $("#total").textContent = Object.values(save.stars).reduce((a, b) => a + b, 0);
}
document.querySelectorAll(".chip").forEach(c => c.onclick = () => { sfx("click"); save.klasa = c.dataset.f; persist(); drawMap() });
// ?klasa=4 albo ?klasa=5 w adresie ustawia filtr (np. link z planu lekcji)
{ const k = new URLSearchParams(location.search).get("klasa"); if (k === "4" || k === "5") { save.klasa = k; persist() } }

/* pasek poziomu: klasa i link do filmu z bieżącego tematu */
function drawLevelBar() {
  const p = PASTWISKA.find(x => x.ep === cur.ep) || cur.p, o = ODCINKI[cur.ep];
  $("#lvlKl").outerHTML = klasaTag(p.klasa).replace('<span class="kl', '<span id="lvlKl" class="kl');
  const f = $("#filmBtn");
  f.href = epHref(cur.ep, false);
  f.innerHTML = `<span class="tri"></span>${o.url ? `Obejrzyj odcinek ${cur.ep}` : "Kanał YouTube"}`;
  f.title = `Odcinek ${cur.ep}: ${o.tytul}`;
}

/* ============ silnik poziomu ============ */
let cur = null;
const roundsOf = () => cur.game.rounds || 8;
const isLast = () => cur.i === roundsOf() - 1;

const ui = {
  grok(html) { $("#grokSay").innerHTML = html },
  beata(html, mood = "") {
    const b = $("#beataSay");
    b.className = "say say-beata" + (html ? "" : " off") + (mood ? " " + mood : "");
    b.innerHTML = html || "&nbsp;";
    const img = $("#beataImg"); img.classList.remove("hop", "shake"); void img.offsetWidth;
    if (mood === "good") img.classList.add("hop"); if (mood === "bad") img.classList.add("shake");
  },
  action(label, fn, disabled = false) { const b = $("#act"); b.hidden = false; b.textContent = label; b.onclick = () => { sfx("click"); fn() }; b.disabled = disabled },
  action2(label, fn) { const b = $("#act2"); b.hidden = !label; if (label) { b.textContent = label; b.onclick = () => { sfx("click"); fn() } } },
  hideActions() { $("#act").hidden = true; $("#act2").hidden = true },
  nextLabel() { return isLast() ? "Koniec →" : "Dalej →" },
  done() { ui.action2(null); ui.action(ui.nextLabel(), ui.next) },
  // opóźnienie, które samo się anuluje, gdy dziecko przejdzie dalej albo wyjdzie z pastwiska
  later(fn, ms) { const tok = cur.token; setTimeout(() => { if (cur && cur.token === tok) fn() }, ms) },
  error() {
    cur.errors++; cur.roundErrors++; sfx("bad");
    if (cur.errors >= 2) { const t = $("#tip"); t.hidden = false; t.innerHTML = `Coś nie wychodzi? Obejrzyj ${epLink(cur.ep)}.` }
  },
  correct() { sfx("ok") },
  next() { cur.dotState[cur.i] = cur.roundErrors ? "meh" : "ok"; cur.i++; startRound() },
};

const PRAISE = ["Bee-ardzo dobrze!", "No proszę, trafione!", "Brawo! Nawet ja bym lepiej nie policzyła.", "Super! Grok jest z ciebie dumny.", "Tak jest! Bee!", "Pięknie! Należy się garść siana."];
const praise = () => pick(PRAISE);

/* zegar finału: pasek się kurczy, a gdy dojdzie do końca, Beata zasypia */
let clockT = null;
function stopClock() { clearInterval(clockT); clockT = null }
function startClock(sec) {
  stopClock();
  const bar = $("#clockBar"); bar.style.width = "100%"; $("#clock").classList.remove("low");
  clockT = setInterval(() => {
    if (!cur) return stopClock();
    const left = Math.max(0, 1 - (Date.now() - cur.t0) / 1000 / sec);
    bar.style.width = left * 100 + "%"; $("#clock").classList.toggle("low", left < .25);
    if (left === 0) { stopClock(); cur.slept = true; $("#beataImg").src = "img/owca-spi.png"; ui.beata("Chrrr… zasnęłam. Ale dokończ, gwiazdki wciąż czekają!") }
  }, 250);
}

function startLevel(key) {
  stopClock();
  const p = PASTWISKA.find(p => p.key === key);
  if (!p || p.soon) { showMap(); return }
  cur = { p, game: GAMES[key], i: 0, errors: 0, roundErrors: 0, dotState: [], ep: p.ep, slept: false, t0: Date.now() };
  if (cur.game.setup) cur.game.setup(cur);
  $("#map").hidden = true; $("#level").hidden = false; $("#end").hidden = true;
  $("#tip").hidden = true;
  $("#beataImg").src = "img/beata.png";
  $("#clock").hidden = !cur.game.time;
  if (cur.game.time) startClock(cur.game.time);
  $("#cheatBtn").hidden = !cur.game.cheat;
  $("#cheatBtn").onclick = () => { sfx("click"); const c = document.querySelector(".cheat"); if (c) c.remove(); else $("#play").insertAdjacentHTML("afterbegin", cur.game.cheat) };
  window.scrollTo(0, 0);
  startRound();
}
function drawDots() {
  $("#dots").innerHTML = Array.from({ length: roundsOf() }, (_, i) => `<i class="${i === cur.i ? "now" : cur.dotState[i] || ""}"></i>`).join("");
}
function startRound() {
  if (cur.i >= roundsOf()) return finish();
  document.onkeydown = null; // klawiatura numeryczna z poprzedniej rundy
  cur.roundErrors = 0; cur.token = {}; cur.ep = cur.p.ep;
  $("#lvlName").textContent = `${cur.p.nr}. ${cur.p.title}`;
  const act = $("#act"); act.hidden = false; act.disabled = false; $("#act2").hidden = true;
  drawDots(); ui.beata("");
  cur.game.round(cur.i, ui);
  drawLevelBar();
}
function finish() {
  document.onkeydown = null; stopClock(); drawDots();
  const e = cur.errors;
  let st = e <= 1 ? 3 : e <= 3 ? 2 : 1;
  if (cur.slept) st = Math.min(st, 2);
  const best = Math.max(save.stars[cur.p.key] || 0, st);
  save.stars[cur.p.key] = best; persist();
  $("#total").textContent = Object.values(save.stars).reduce((a, b) => a + b, 0);
  sfx("win");

/* =====================================================================
   PASTWISKO 2: OWCA NA OSI (odcinek 5)
   Oś ma 10 skoków (11 kresek). Część kresek ma podpisy; z nich dziecko
   wylicza, ile wart jest jeden skok. Dwa rodzaje rund:
   „place”: przeciągnij owcę na liczbę, „read”: odczytaj, gdzie stoi owca.
   ===================================================================== */
const OS_PLAN = [
  () => ({ step: 1, start: 0, labels: [0, 5, 10], mode: "place" }),
  () => ({ step: 1, start: pick([10, 20, 30]), labels: [0, 10], mode: "read" }),
  () => ({ step: 2, start: 0, labels: [0, 5, 10], mode: "place" }),
  () => ({ step: 5, start: 0, labels: [0, 10], mode: "read" }),
  () => ({ step: 10, start: pick([0, 100, 200]), labels: [0, 5, 10], mode: "place" }),
  () => ({ step: 5, start: pick([20, 30, 40, 50]), labels: [0, 10], mode: "read" }),
  () => ({ step: 100, start: 0, labels: [0, 10], mode: "place" }),
  () => { // zagadka z odcinka: podpisane są tylko dwie kreski w środku osi
    const step = pick([2, 5]), i = rnd(1, 4), L = step === 2 ? pick([20, 40, 60]) : pick([50, 100, 150]);
    return { step, start: L - i * step, labels: [i, i + 5], mode: "place" };
  },
];
const AX = { x0: 50, dx: 60, y: 180 };
const ax = k => AX.x0 + k * AX.dx;

const GAMES_OS = {
  round(i, ui) {
    const c = OS_PLAN[i]();
    const val = k => c.start + k * c.step;
    let target; do { target = rnd(1, 9) } while (c.labels.includes(target));
    const v = val(target);
    const [la, lb] = [c.labels[0], c.labels[c.labels.length - 1]];
    const stepHint = `Od ${num(val(la))} do ${num(val(lb))} jest ${lb - la} ${skokow(lb - la)}, więc jeden skok to ${num(c.step)}.`;
    const countHint = () => { // licz skokami od najbliższego podpisu
      const L = c.labels.reduce((b, l) => Math.abs(l - target) < Math.abs(b - target) ? l : b);
      const dir = target > L ? 1 : -1, seq = [];
      for (let k = L + dir; k !== target + dir; k += dir) seq.push(fmt(val(k)));
      return `Licz skokami od ${num(val(L))}: ${seq.join(", ")}.`;
    };

    let ticks = "", labels = "";
    for (let k = 0; k <= 10; k++) {
      const big = k % 5 === 0 || c.labels.includes(k);
      ticks += `<line x1="${ax(k)}" x2="${ax(k)}" y1="${AX.y - (big ? 18 : 11)}" y2="${AX.y + (big ? 18 : 11)}" stroke="#2b2340" stroke-width="${big ? 5 : 4}" stroke-linecap="round"/>`;
      if (c.labels.includes(k)) labels += `<text class="lbl" x="${ax(k)}" y="${AX.y + 52}">${fmt(val(k))}</text>`;
    }
    $("#play").innerHTML = `<div class="axis-wrap">
      <svg class="axis" viewBox="0 30 700 220" role="img" aria-label="Oś liczbowa">
        <rect x="0" y="30" width="700" height="220" fill="transparent"/>
        <line x1="22" x2="672" y1="${AX.y}" y2="${AX.y}" stroke="#2b2340" stroke-width="5" stroke-linecap="round"/>
        <path d="M664 ${AX.y - 11} L688 ${AX.y} L664 ${AX.y + 11} Z" fill="#2b2340"/>
        ${ticks}${labels}
        <g class="sh" id="sh">
          <ellipse cx="0" cy="${AX.y - 2}" rx="30" ry="6" fill="#2b234033"/>
          <g class="bob" id="bob"><image href="img/owca.png" x="-46" y="${AX.y - 82}" width="92" height="80"/></g>
          <g class="tag" id="tag" style="display:none">
            <rect id="tagBg" x="-40" y="${AX.y - 132}" width="80" height="38" rx="12" stroke="#2b2340" stroke-width="3"/>
            <path id="tagTip" d="M-8 ${AX.y - 96} L0 ${AX.y - 86} L8 ${AX.y - 96} Z" stroke="#2b2340" stroke-width="3" stroke-linejoin="round"/>
            <text id="tagTx" x="0" y="${AX.y - 104}"></text>
          </g>
        </g>
      </svg></div>
      ${c.mode === "place" ? `<p class="drag-hint">Przeciągnij owcę albo stuknij w kreskę.</p>` : `<div class="opts" id="opts"></div>`}`;

    const svg = $(".axis"), sh = $("#sh");
    let pos = c.mode === "place" ? 0 : target, tries = 0, locked = false;
    const setPos = () => { sh.style.transform = `translateX(${ax(pos)}px)` };
    const tag = (text, color) => {
      if (text === null) { $("#tag").style.display = "none"; return }
      $("#tag").style.display = ""; $("#tagTx").textContent = text;
      const w = Math.max(56, String(text).length * 17 + 24);
      $("#tagBg").setAttribute("x", -w / 2); $("#tagBg").setAttribute("width", w);
      $("#tagBg").setAttribute("fill", color); $("#tagTip").setAttribute("fill", color);
    };
    const hop = () => { const b = $("#bob"); b.classList.remove("hop"); void b.getBBox(); b.classList.add("hop") };
    setPos();

    const win = () => {
      locked = true; svg.classList.add("locked");
      pos = target; setPos(); tag(fmt(v), "#2fbf71"); hop();
      ui.action(ui.nextLabel(), ui.next);
    };
    const good = () => { ui.correct(); win(); ui.grok(`Tak! Owca stoi na ${num(v)}.`); ui.beata(praise(), "good") };
    const reveal = () => { win(); ui.grok(`Zobacz, tutaj jest ${num(v)}. ${stepHint}`); ui.beata("Nic się nie stało. Następna owca na pewno trafi!", "bad") };

    if (c.mode === "place") {
      ui.grok(`Postaw owcę na liczbie ${num(v)}.`);
      const toK = e => {
        const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse());
        return Math.max(0, Math.min(10, Math.round((p.x - AX.x0) / AX.dx)));
      };
      let drag = false;
      const move = e => { const k = toK(e); if (k !== pos) { pos = k; setPos(); tag(null); sfx("tick") } };
      svg.onpointerdown = e => { if (locked) return; e.preventDefault(); drag = true; try { svg.setPointerCapture(e.pointerId) } catch (_) {} move(e) };
      svg.onpointermove = e => { if (drag && !locked) move(e) };
      svg.onpointerup = svg.onpointercancel = () => { drag = false };
      // klawiatura: strzałki przesuwają owcę
      svg.tabIndex = 0;
      svg.onkeydown = e => {
        if (locked) return;
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); pos = Math.max(0, Math.min(10, pos + (e.key === "ArrowLeft" ? -1 : 1))); setPos(); tag(null); sfx("tick") }
        if (e.key === "Enter") $("#act").click();
      };
      ui.action("Sprawdź", () => {
        if (pos === target) return good();
        tries++; ui.error();
        tag(fmt(val(pos)), "#ef4f4f");
        if (tries >= 3) return reveal();
        ui.beata(`Bee… ta owca stoi na ${num(val(pos))}, a miała stanąć na ${num(v)}.`, "bad");
        ui.grok(tries === 1 ? stepHint : `${stepHint} ${countHint()}`);
      });
    } else {
      ui.grok(`Na jakiej liczbie stoi owca?`);
      tag("?", "#ff6fa8");
      svg.classList.add("locked");
      const wrong = new Set();
      const cands = [v + c.step, v - c.step, c.step > 1 ? c.start + target : v + 2 * c.step, c.step > 1 ? v + 1 : v - 2 * c.step, v + 10 * c.step / 2];
      for (const w of shuffle(cands)) if (w !== v && w >= 0 && wrong.size < 2) wrong.add(w);
      const opts = shuffle([v, ...wrong]);
      $("#opts").innerHTML = opts.map(o => `<button class="btn opt" data-v="${o}">${fmt(o)}</button>`).join("");
      $("#act").hidden = true;
      document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        const o = +b.dataset.v;
        if (o === v) {
          b.classList.add("yes"); document.querySelectorAll(".opt").forEach(x => x.disabled = true);
          $("#act").hidden = false; return good();
        }
        tries++; ui.error(); b.classList.add("no"); b.disabled = true;
        if (tries >= 2) { document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.v === v) x.classList.add("yes") }); $("#act").hidden = false; return reveal() }
        ui.beata(`Bee… to nie ${num(o)}. Policz jeszcze raz!`, "bad");
        ui.grok(`${stepHint} ${countHint()}`);
      });
    }
  },
};

/* =====================================================================
   PASTWISKO 3: ZAGRODY (odcinek 2, cechy podzielności)
   Grok ma N owiec. Zagroda „po k” pasuje, gdy N dzieli się przez k.
   Dziecko zaznacza wszystkie pasujące zagrody i raz sprawdza.
   ===================================================================== */
const ZAG_PLAN = [
  { pens: [2, 5, 10], min: 10, max: 40 },
  { pens: [2, 5, 10], min: 11, max: 60 },
  { pens: [2, 3, 5, 10], min: 12, max: 60 },
  { pens: [2, 3, 5, 9], min: 30, max: 200 },
  { pens: [2, 3, 4, 5], min: 100, max: 999 },
  { pens: [3, 4, 9, 10], min: 100, max: 999 },
  { pens: [2, 3, 4, 5, 9, 10], min: 100, max: 2000 },
  { pens: [2, 3, 4, 5, 9, 10], min: 1000, max: 9999 },
];
const KAMI = { 2: "parami", 3: "trójkami", 4: "czwórkami", 5: "piątkami", 9: "dziewiątkami", 10: "dziesiątkami" };
const SHOW_MAX = 60; // do tylu owiec rysujemy całe stado

function zagN(plan) {
  for (let t = 0; t < 500; t++) {
    let n;
    if (Math.random() < .85) { const d = pick(plan.pens); n = d * rnd(Math.ceil(plan.min / d), Math.floor(plan.max / d)) }
    else n = rnd(plan.min, plan.max);
    const ok = plan.pens.filter(d => n % d === 0).length;
    if (ok >= 1 && ok < plan.pens.length) return n;
  }
  return plan.pens[0] * 7;
}
function rule(n, d) {
  const s = String(n), ok = n % d === 0, last = n % 10, nie = ok ? "" : "nie ";
  if (d === 2) return `Ostatnia cyfra ${last} jest ${last % 2 ? "nieparzysta" : "parzysta"}.`;
  if (d === 5) return `Ostatnia cyfra to ${last}${ok ? "." : ", a nie 0 ani 5."}`;
  if (d === 10) return `Ostatnia cyfra to ${last}${ok ? "." : ", a nie 0."}`;
  if (d === 4) { const two = n % 100; return n < 100 ? `${n} ${nie}dzieli się przez 4.` : `Dwie ostatnie cyfry: ${String(two).padStart(2, "0")}. ${two} ${nie}dzieli się przez 4.` }
  const sum = [...s].reduce((a, c) => a + +c, 0);
  return `Suma cyfr: ${[...s].join(" + ")} = ${sum}. ${sum} ${nie}dzieli się przez ${d}.`;
}
function herdHTML(n, k) {
  if (n > SHOW_MAX) return "";
  const sheep = '<img src="img/owca.png" alt="">';
  if (!k) return `<div class="flock">${sheep.repeat(n)}</div>`;
  const g = Math.floor(n / k), r = n % k;
  let h = "";
  for (let i = 0; i < g; i++) h += `<div class="grp" style="animation-delay:${Math.min(i * 25, 600)}ms">${sheep.repeat(k)}</div>`;
  if (r) h += `<div class="rest"><span>reszta ${r}</span><img src="img/beata.png" alt="Beata">${sheep.repeat(r - 1)}</div>`;
  return `<div class="flock">${h}</div>`;
}

const GAMES_ZAG = {
  cheat: `<div class="cheat"><h4>Ściąga z odcinka 2</h4><ul>
    <li><b>przez 2:</b> ostatnia cyfra parzysta (0, 2, 4, 6, 8)</li>
    <li><b>przez 5:</b> ostatnia cyfra 0 albo 5</li>
    <li><b>przez 10:</b> ostatnia cyfra 0</li>
    <li><b>przez 4:</b> dwie ostatnie cyfry tworzą liczbę podzielną przez 4</li>
    <li><b>przez 3:</b> suma cyfr dzieli się przez 3</li>
    <li><b>przez 9:</b> suma cyfr dzieli się przez 9</li></ul></div>`,
  round(i, ui) {
    const plan = ZAG_PLAN[i], n = zagN(plan), sel = new Set();
    const ask = i === 0
      ? `Mam ${num(n)} ${owiec(n)}. Do których zagród zmieszczą się <u>po równo</u>, tak żeby żadna owca nie została sama? Zaznacz wszystkie pasujące.`
      : `Mam ${num(n)} ${owiec(n)}. Które zagrody pasują?<small>Zaznacz wszystkie, w których owce zmieszczą się po równo.</small>`;
    ui.grok(ask);
    $("#play").innerHTML = `
      <div class="herd"><div class="sign">Stado: <b>${fmt(n)}</b> ${owiec(n)}</div><div id="herdBox">${herdHTML(n)}</div></div>
      <div class="pens" id="pens">${plan.pens.map(d => `
        <button class="pen" data-d="${d}" aria-pressed="false"><span class="box"></span>
          <span class="k">po ${d}</span><span class="w">${KAMI[d]}</span>
          <span class="verdict"></span>
          <span class="res"><span class="eq"></span><span class="why"></span></span>
        </button>`).join("")}</div>
      <p class="zoom-hint" id="zoomHint" hidden>Stuknij zagrodę, żeby zobaczyć, jak ustawią się owce.</p>`;
    let checked = false;
    const pens = [...document.querySelectorAll(".pen")];
    const showGroups = d => {
      pens.forEach(p => p.classList.toggle("show", +p.dataset.d === d));
      $("#herdBox").innerHTML = herdHTML(n, d);
    };
    pens.forEach(p => p.onclick = () => {
      const d = +p.dataset.d;
      if (checked) { if (n <= SHOW_MAX) { sfx("click"); showGroups(d) } return }
      sfx("click");
      sel.has(d) ? sel.delete(d) : sel.add(d);
      p.classList.toggle("sel", sel.has(d)); p.setAttribute("aria-pressed", sel.has(d));
    });
    ui.action("Sprawdź", () => {
      checked = true;
      const box = $("#pens"); box.classList.add("checked"); if (n <= SHOW_MAX) box.classList.add("zoomable");
      const bad = [], miss = [];
      pens.forEach(p => {
        const d = +p.dataset.d, ok = n % d === 0, chose = sel.has(d), q = Math.floor(n / d), r = n % d;
        p.classList.remove("sel");
        const [cls, txt] = ok && chose ? ["v-ok", "Dobrze!"] : !ok && chose ? ["v-bad", "Nie pasuje"] : ok ? ["v-miss", "Ta też pasowała"] : ["v-skip", "Słusznie pominięta"];
        p.classList.add(cls); p.querySelector(".verdict").textContent = txt;
        p.querySelector(".eq").textContent = `${fmt(n)} : ${d} = ${fmt(q)}${r ? ` r. ${r}` : ""}`;
        p.querySelector(".why").textContent = rule(n, d);
        if (!ok && chose) bad.push(d); if (ok && !chose) miss.push(d);
      });
      if (n <= SHOW_MAX) {
        $("#zoomHint").hidden = false;
        showGroups(bad[0] || miss[0] || [...sel].find(d => n % d === 0) || plan.pens.find(d => n % d === 0));
      }
      if (!bad.length && !miss.length) {
        ui.correct(); ui.beata(praise(), "good");
        ui.grok(`Tak! Owce zmieszczą się po równo w zagrodach ${plan.pens.filter(d => n % d === 0).map(d => "po " + d).join(", ")}.`);
      } else {
        ui.error();
        const parts = [];
        if (bad.length) parts.push(`W zagrodzie po ${bad[0]} zostaje reszta ${n % bad[0]}. A ta reszta to zawsze ja!`);
        if (miss.length) parts.push(`${bad.length ? "I z" : "Z"}agroda po ${miss[0]} też pasowała.`);
        ui.beata("Bee… " + parts.join(" "), "bad");
        ui.grok(`Sprawdźmy każdą zagrodę. Wyniki są na kartkach.`);
      }
      ui.action(ui.nextLabel(), ui.next);
    });
  },
};

/* =====================================================================

const SZ_WORDS = [["kilka", 2, 9, "mniej niż 10"], ["kilkanaście", 11, 19, "od 11 do 19"], ["kilkadziesiąt", 20, 99, "od 20 do 99"], ["kilkaset", 200, 999, "od 200 do 999"]];

function meadowHTML(n) {
  // owce w losowych miejscach siatki, z przesunięciem, żeby się nie nakładały
  const cols = Math.ceil(Math.sqrt(n * 2.6)), rows = Math.ceil(n / cols);
  const cells = shuffle(Array.from({ length: cols * rows }, (_, i) => i)).slice(0, n);
  const w = n <= 9 ? 12 : n <= 19 ? 9 : n <= 50 ? 6.4 : 5;     // szerokość owcy w % łąki
  const h = w * .87 * 2.6;                                       // wysokość owcy w % łąki (łąka ma proporcje 2.6 : 1)
  return cells.map((c, k) => {
    const x = (c % cols + Math.random() * .6) / cols * (100 - w);
    const y = 26 + (Math.floor(c / cols) + Math.random() * .6) / rows * (72 - h);
    return `<img src="img/owca.png" alt="" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;width:${w}%;animation-delay:${Math.min(k * 25, 800)}ms">`;
  }).join("");

function tensHTML(n) {

}

          const g = +$("#gr").value, tol = Math.max(5, Math.round(n * .2));
          $("#gr").disabled = true; reveal();
          if (Math.abs(g - n) <= tol) { ui.correct(); ui.beata(`Było ${num(n)}, a ty mówisz około ${num(g)}. Świetny szacunek!`, "good") }
          else { ui.error(); ui.beata(`Bee… było ${num(n)}, a ty mówisz około ${num(g)}. To za ${g < n ? "mało" : "dużo"}.`, "bad") }

  },
  market(ui) {

    const R = items.reduce((a, x) => a + x.r, 0), exact = items.reduce((a, x) => a + x.p, 0);
    const B = R + pick([-20, -10, 10, 20]), enough = exact <= B;
    ui.grok(`Grok idzie na targ i ma ${num(B)} zł. Wystarczy mu na wszystko? Nie licz dokładnie, tylko oszacuj!`);

    const answer = yes => {

      if (yes === enough) { ui.correct(); ui.beata(praise(), "good") } else { ui.error(); ui.beata(enough ? "Bee… a jednak wystarczy, i jeszcze zostanie reszta!" : "Bee… zabraknie pieniędzy, a ja zostanę bez marchewek!", "bad") }
      ui.grok(expl); ui.done();
    };
    ui.action("Wystarczy", () => answer(true));

    const a = near(), b = near(), s = a.v + b.v, right = Math.random() < .5;

    const R = a.r + b.r;

/* =====================================================================
   PASTWISKO 4: STADO W PROSTOKĄT (odcinek 3, liczby pierwsze i złożone)
   Dziecko zmienia liczbę rzędów. Gdy wyjdzie prostokąt (więcej niż jeden rząd
   i jedna kolumna), liczba jest złożona. Jeśli się nie da, jest pierwsza.
   ===================================================================== */
const isPrime = n => { if (n < 2) return false; for (let d = 2; d * d <= n; d++) if (n % d === 0) return false; return true };
const divisors = n => Array.from({ length: n }, (_, i) => i + 1).filter(d => n % d === 0);
function rzedow(n) { const d = n % 10, dd = n % 100; if (n === 1) return "rząd"; if (d >= 2 && d <= 4 && !(dd >= 12 && dd <= 14)) return "rzędy"; return "rzędów" }
const poOwiec = c => c === 1 ? "po 1 owcy" : `po ${c} ${owiec(c)}`;
const PR_PLAN = [
  () => pick([6, 8, 10, 12]), () => pick([5, 7]), () => pick([14, 15, 16, 18, 20]), () => pick([11, 13]),
  () => rnd(15, 30), () => pick([17, 19, 23, 29]), () => rnd(20, 40), () => rnd(20, 40),
];

const GAMES_PROST = {
  round(i, ui) {
    const n = PR_PLAN[i](), prime = isPrime(n), maxR = Math.min(n, 12);
    const small = divisors(n).find(d => d > 1 && d < n);
    let r = 1, tries = 0, locked = false;
    ui.grok(i === 0
      ? `Mam ${num(n)} ${owiec(n)}. Ustaw je w prostokąt: kilka rzędów, w każdym tyle samo owiec. Zmieniaj liczbę rzędów przyciskami − i +. Jeśli prostokąta nie da się ułożyć, kliknij „Nie da się!”.`
      : `Mam ${num(n)} ${owiec(n)}. Ułożysz z nich prostokąt?`);
    $("#play").innerHTML = `<div class="rows-ctl"><button class="btn step" id="minus" aria-label="Mniej rzędów">−</button>
      <div class="rows-n"><b id="rn">1</b><span id="rl">rząd</span></div><button class="btn step" id="plus" aria-label="Więcej rzędów">+</button></div>
      <div class="pasture" id="pasture"></div><p class="rows-info" id="ri"></p>`;
    const draw = () => {
      const c = Math.ceil(n / r), holes = r * c - n;
      const p = $("#pasture");
      p.style.gridTemplateColumns = `repeat(${c}, minmax(0, 46px))`;
      p.innerHTML = Array.from({ length: r * c }, (_, k) => k < n ? '<img src="img/owca.png" alt="">' : '<span class="hole"></span>').join("");
      p.classList.toggle("full", !holes && r > 1 && c > 1);
      $("#rn").textContent = r; $("#rl").textContent = rzedow(r);
      $("#ri").innerHTML = holes ? `${r} ${rzedow(r)} ${poOwiec(c)}, ale w ostatnim brakuje ${holes} ${holes === 1 ? "owcy" : "owiec"}.` : r === 1 || c === 1 ? `Jeden długi ${r === 1 ? "rząd" : "słupek"}.` : `${r} ${rzedow(r)} ${poOwiec(c)}: ${r} × ${c} = ${n}`;
      $("#minus").disabled = locked || r <= 1; $("#plus").disabled = locked || r >= maxR;
    };
    $("#minus").onclick = () => { if (r > 1) { r--; sfx("tick"); draw() } };
    $("#plus").onclick = () => { if (r < maxR) { r++; sfx("tick"); draw() } };
    draw();
    const divText = `Dzielniki liczby ${n}: ${divisors(n).join(", ")}.`;
    const end = html => { locked = true; draw(); ui.grok(html); ui.done() };
    const win = () => { ui.correct(); ui.beata(praise(), "good"); end(`Tak! ${r} × ${Math.ceil(n / r)} = ${num(n)}. ${divText} Więcej niż dwa, więc ${n} to <b>liczba złożona</b>.`) };
    const winPrime = () => { ui.correct(); ui.beata(praise(), "good"); r = 1; end(`Tak! ${num(n)} ${owiec(n)} da się ustawić tylko w jeden rząd albo w jeden słupek. ${divText} Tylko dwa, więc ${n} to <b>liczba pierwsza</b>.`) };
    const miss = () => {
      tries++; ui.error();
      if (tries >= 3) {
        ui.beata("Nic się nie stało. Grok pokaże, jak to jest.", "bad");
        if (prime) { r = 1; end(`${num(n)} nie dzieli się przez żadną liczbę oprócz 1 i ${n}. ${divText} To <b>liczba pierwsza</b>.`) }
        else { r = small; end(`Zobacz: ${small} × ${n / small} = ${num(n)}. ${divText} To <b>liczba złożona</b>.`) }
        return true;
      }
      ui.grok(tries === 1 ? `Sprawdź, czy ${n} dzieli się przez 2, 3, 4… Tyle rzędów warto spróbować.` : prime ? `${n} nie dzieli się ani przez 2, ani przez 3, ani przez 5… Może to liczba pierwsza?` : `${n} dzieli się przez ${small}. Spróbuj ${small} ${rzedow(small)}.`);
      return false;
    };
    ui.action("To jest prostokąt!", () => {
      const c = Math.ceil(n / r), holes = r * c - n;
      if (!holes && r > 1 && c > 1) return win();
      const msg = holes ? "Bee… w ostatnim rzędzie brakuje owiec. To jeszcze nie prostokąt." : "Bee… to jeden długi rząd, a Grok chce prawdziwy prostokąt.";
      if (!miss()) ui.beata(msg, "bad");
    });
    ui.action2("Nie da się!", () => {
      if (prime) return winPrime();
      if (!miss()) ui.beata("Bee… a jednak się da! Szukaj dalej.", "bad");
    });
  },
};

/* =====================================================================
   PASTWISKO 5: OKRĄGŁE PARY (odcinek 8, sprytne dodawanie)
   Sześć grupek owiec, trzy pary. Każda para razem daje 10, 100 albo 1000.
   ===================================================================== */
const PA_PLAN = [
  { T: 10, gen: () => rnd(1, 4) }, { T: 10, gen: () => rnd(1, 4) },
  { T: 100, gen: () => pick([10, 20, 30, 40, 15, 25, 35, 45]) }, { T: 100, gen: () => pick([10, 20, 30, 40, 15, 25, 35, 45]) },
  { T: 100, gen: () => { let a; do a = rnd(11, 49); while (a % 10 === 0); return a } }, { T: 100, gen: () => { let a; do a = rnd(11, 49); while (a % 10 === 0); return a } },
  { T: 1000, gen: () => pick([100, 200, 300, 400, 150, 250, 350, 450, 125, 225, 275, 325, 375, 475]) }, { T: 1000, gen: () => 10 * rnd(11, 49) },
];
const PA_RULE = { 10: "Pomyśl, ile brakuje do 10.", 100: "Najpierw jedności: razem muszą dać pełną dziesiątkę. Potem dziesiątki.", 1000: "Popatrz na końcówki: razem muszą dać pełną setkę." };

const GAMES_PARY = {

    ui.grok(i === 0

    const card = v => `<button class="pair" data-v="${v}">${T === 10 ? `<span class="flock-mini">${'<img src="img/owca.png" alt="">'.repeat(v)}</span>` : '<img class="one" src="img/owca.png" alt="">'}<span class="pn">${fmt(v)}</span></button>`;
    $("#play").innerHTML = `<div class="target"><img src="img/kosmita.png" alt=""><div class="sign">Razem: <b>${fmt(T)}</b></div></div>
      <div class="pairs">${nums.map(card).join("")}</div><div class="pair-done" id="pd"></div>`;
    ui.hideActions();

      const a = +sel.dataset.v, b = +el.dataset.v, first = sel; sel = null;

        $("#pd").insertAdjacentHTML("beforeend", `<span>${fmt(a)} + ${fmt(b)} = ${fmt(T)}</span>`);
        if (found === 3) {

          ui.grok(`Łąka pusta! Wszystkie pary dają razem ${num(T)}.`);
          ui.done();
        } else ui.beata(`${fmt(a)} + ${fmt(b)} = ${fmt(T)}. Tak jest!`, "good");

      }

      ui.beata(`Bee… ${fmt(a)} + ${fmt(b)} = ${fmt(a + b)}, a nie ${fmt(T)}.`, "bad");
      ui.grok(errs === 1 ? PA_RULE[T] : `${num(a)} potrzebuje ${num(T - a)}, żeby było ${num(T)}.`);
    });
  },
};

// odmiana: pl(5, "owca", "owce", "owiec") → "owiec"
function pl(n, one, few, many) {

  if (n === 1) return one;

}

const nextLabel = () => ui.nextLabel();

function endRound() { $("#act").hidden = false; ui.action(nextLabel(), ui.next) }

const CHEER_UP = ["Nic się nie stało. Następnym razem trafisz!", "Bee… zapamiętaj to, przyda się!", "Spokojnie, Grok też się czasem myli. Codziennie."];

/* ---------- wybór jednej odpowiedzi ----------
   opts: tablica wartości albo {v, t} (t = napis na guziku)
   ok: poprawna wartość, tries: ile prób przed pokazaniem odpowiedzi
   onRight(), onWrong(v, n), onReveal(), then() – co dalej (domyślnie koniec rundy) */
function choice({ el, opts, ok, tries = 2, cls = "", onRight, onWrong, onReveal, then = endRound }) {
  const items = opts.map(o => typeof o === "object" ? o : { v: o, t: typeof o === "number" ? fmt(o) : o });
  el.innerHTML = items.map(o => `<button class="btn opt ${cls}" data-v="${o.v}">${o.t}</button>`).join("");
  $("#act").hidden = true;
  const btns = [...el.querySelectorAll(".opt")];
  let n = 0, done = false;
  const lock = () => { done = true; btns.forEach(x => { x.disabled = true; if (x.dataset.v === String(ok)) x.classList.add("yes") }) };
  btns.forEach(b => b.onclick = () => {
    if (done) return;
    if (b.dataset.v === String(ok)) {
      lock(); ui.correct();
      onRight ? onRight() : ui.beata(praise(), "good");
      return then();
    }
    n++; ui.error(); b.classList.add("no"); b.disabled = true;
    if (n >= tries) { lock(); onReveal ? onReveal() : ui.beata(pick(CHEER_UP), "bad"); return then() }
    onWrong ? onWrong(b.dataset.v, n) : ui.beata("Bee… to nie to. Spróbuj jeszcze raz!", "bad");
  });
}

/* ---------- klawiatura z cyframi ----------
   ok: poprawna liczba, unit: napis po liczbie (np. "°"), max: ile cyfr
   Wpisywać można też z klawiatury komputera. */
function numPad({ el, ok, unit = "", max = 5, tries = 3, label = "Sprawdź", onRight, onWrong, onReveal, then = endRound }) {
  el.innerHTML = `<div class="pad"><div class="pad-show" id="padShow"></div>
    <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => `<button data-d="${d}">${d}</button>`).join("")}<button class="del" data-d="x" aria-label="Usuń">⌫</button><button class="del" data-d="c" aria-label="Wyczyść">C</button></div></div>`;
  let val = "", n = 0, done = false;
  const show = $("#padShow");
  const draw = (cls = "") => {
    show.className = "pad-show " + cls;
    show.innerHTML = (val ? fmt(+val) : "") + (done ? "" : '<span class="cur"></span>') + (unit ? `<span class="u">${unit}</span>` : "");
    $("#act").disabled = !val && !done;
  };
  const press = d => {
    if (done) return;
    if (d === "x") val = val.slice(0, -1);
    else if (d === "c") val = "";
    else if (val.length < max) val = val === "0" ? String(d) : val + d;
    sfx("tick"); draw();
  };
  el.querySelectorAll(".keys button").forEach(b => b.onclick = () => press(b.dataset.d === "x" || b.dataset.d === "c" ? b.dataset.d : +b.dataset.d));
  document.onkeydown = e => {
    if (done) return;
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(+e.key) }
    else if (e.key === "Backspace") { e.preventDefault(); press("x") }
    else if (e.key === "Enter" && val) { e.preventDefault(); $("#act").click() }
  };
  const finish = () => { done = true; document.onkeydown = null; el.querySelectorAll(".keys button").forEach(b => b.disabled = true) };
  $("#act").hidden = false;
  ui.action(label, () => {
    if (!val) return;
    const v = +val;
    if (v === ok) { finish(); draw("good"); ui.correct(); onRight ? onRight() : ui.beata(praise(), "good"); return then() }
    n++; ui.error(); draw("bad");
    if (n >= tries) { val = String(ok); finish(); draw("good"); onReveal ? onReveal(v) : ui.beata(pick(CHEER_UP), "bad"); return then() }
    onWrong ? onWrong(v, n) : ui.beata(`Bee… ${fmt(v)} to nie to. Spróbuj jeszcze raz!`, "bad");
    val = ""; ui.later(() => { if (!done) draw() }, 450);
  });
  draw();
}

// „Nie” albo „Tak” itp. – dwa duże guziki
const yesNo = (a = "Tak", b = "Nie") => [{ v: "t", t: a }, { v: "n", t: b }];

// losowe złe odpowiedzi blisko dobrej (bez duplikatów, bez ujemnych)
function near(ok, cands, k = 2) {
  const out = new Set();
  for (const c of shuffle([...cands])) if (c !== ok && c >= 0 && out.size < k) out.add(c);
  let d = 1; while (out.size < k) { if (!out.has(ok + d) && ok + d !== ok) out.add(ok + d); d++ }
  return shuffle([ok, ...out]);
}
